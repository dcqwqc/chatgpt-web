name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/test_chrome_recipe.js tests/test_composer_cdp.js
      - run: python scripts/check_public_tree.py

  plugins:
    name: BB plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bb-plugin-provider-icons/package-lock.json
            bb-plugin-rich-ui/package-lock.json
      - name: Install provider icons dependencies
        working-directory: bb-plugin-provider-icons
        run: npm ci --no-audit --no-fund
      - name: Check provider icons types
        working-directory: bb-plugin-provider-icons
        run: npm test
      - name: Install Rich UI dependencies
        working-directory: bb-plugin-rich-ui
        run: npm ci --no-audit --no-fund
      - name: Check Rich UI types and rendering
        working-directory: bb-plugin-rich-ui
        run: |
          npm run typecheck
          npm test
